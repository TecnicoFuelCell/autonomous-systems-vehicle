name: CI

on:
  push:
    branches: [main, ci/github-actions]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # car_msgs (custom messages) lives in the `core` submodule and must build
  # before the vehicle packages that depend on it.
  CORE_MSG_PATH: core/ros2_ws/src/car_msgs
  VEHICLE_WORKSPACE: ros2-vehicle

jobs:
  build-and-test:
    name: Build car_msgs + ros2-vehicle and run tests
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
    permissions:
      contents: read
    steps:
      - name: Checkout (with core submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      # .gitmodules points the submodule at an SSH URL; rewrite it so the
      # token-based HTTPS auth used by checkout applies to submodules too.
      - name: Rewrite submodule URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git

      - name: rosdep install
        run: |
          rosdep update
          rosdep install --from-paths ${{ env.CORE_MSG_PATH }} ${{ env.VEHICLE_WORKSPACE }} \
            --ignore-src -r -y

      - name: colcon build
        run: |
          colcon build --base-paths ${{ env.CORE_MSG_PATH }} ${{ env.VEHICLE_WORKSPACE }}

      - name: colcon test
        run: |
          colcon test --base-paths ${{ env.CORE_MSG_PATH }} ${{ env.VEHICLE_WORKSPACE }}
          colcon test-result --all --verbose

      - name: Upload colcon logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs
          path: log/
          if-no-files-found: ignore
