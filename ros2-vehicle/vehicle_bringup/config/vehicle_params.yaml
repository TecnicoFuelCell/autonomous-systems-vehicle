# Vehicle I/O and calibration (autonomy stack params live in autonomous-systems-core).

# Sensor nodes parameters
webcam_publisher:
  ros__parameters:
    device_path: &camera_device_path "/dev/video0"
    publish_rate: 30.0
    topic_name: "/zed/left_camera/image_raw"
    frame_width: 1280
    frame_height: 720
    camera_fps: 30.0
    pixel_format: "MJPG"
    configure_exposure: true
    exposure_absolute: 3
    exposure_auto: 1
    exposure_fail_fast: false

camera_info_node:
  ros__parameters:
    intrinsics_path: 'calibration/camera_intrinsics.json'
    extrinsics_path: 'calibration/camera_extrinsics.json'
    intrinsics_topic: '/my/camera_info'
    extrinsics_topic: '/my/camera_extrinsics'
    publish_intrinsics: true
    publish_extrinsics: true

joy_node:
  ros__parameters:
    device_id: 0              # corresponds to /dev/input/js0
    deadzone: 0.05
    autorepeat_rate: 20.0

joystick_reader:
  ros__parameters:
    joy_topic: "/vehicle_internal/joystick/raw"
    output_topic: "/vehicle_internal/joystick/commands"

deadman_node:
  ros__parameters:
    alive_timeout: 0.5 # seconds without an ALIVE line before disarming

mag_node:
  ros__parameters:
    apply_mag_calib: true
    mag_calib_path: 'calibration/mag_calib.json'

gps_node:
  ros__parameters:
    use_first_fix_as_origin: false
    origin_latitude: 38.7366804
    origin_longitude: -9.300988216666667
    origin_altitude: 0.0
    synthetic_mode: false

# Utility nodes parameters
uart_node:
  ros__parameters:
    serial_port: "/dev/ttyACM0" # CANToPC (sensor UART read)

uart_writer:
  ros__parameters:
    serial_port: "/dev/ttyACM1" # PCToCAN (command UART write)

# Calibration nodes parameters
calibrate_extrinsics:
  ros__parameters:
    output_path: 'calibration/camera_extrinsics.json'
    intrinsics_path: 'calibration/camera_intrinsics.json'

calibrate_intrinsics:
  ros__parameters:
    image_topic: '/zed/left_camera/image_raw'
    rows: 8
    columns: 5
    square_size: 0.0255
    frame_skip: 20
    output_path: 'calibration/camera_intrinsics.json'
    device_path: *camera_device_path
    max_samples: 30
    show_preview: true
