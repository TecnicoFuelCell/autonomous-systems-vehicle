# Naming and define-once rules: AGENTS.md, section "ROS 2 parameters".
/**:
  ros__parameters:
    # Logger level of every vehicle node: debug, info, warn, error, fatal.
    log_level: "warn"

    # Raw CANToPC UART lines: uart_reader -> decoder nodes (internal)
    serial_vesc_topic: "/vehicle_internal/serial/vesc"        # -> vesc_node
    serial_dir_topic: "/vehicle_internal/serial/dir"          # -> dir_node
    serial_acc_topic: "/vehicle_internal/serial/acc"          # -> imu_node
    serial_gyro_topic: "/vehicle_internal/serial/gyro"        # -> imu_node
    serial_mag_topic: "/vehicle_internal/serial/mag"          # -> mag_node
    serial_deadman_topic: "/vehicle_internal/serial/deadman"  # -> deadman_node

    # Decoded sensor data (interface)
    vesc_topic: "/vesc_data"         # vesc_node
    dir_topic: "/dir_data"           # dir_node
    imu_topic: "/imu_data"           # imu_node or xsens_mti_node (remap in sensors_launch.xml)
    mag_topic: "/mag_data"           # mag_node or xsens_mti_node (remap in sensors_launch.xml)
    gps_fix_topic: "/gps/fix"        # gps_node or u-blox (remap in sensors_launch.xml)
    gps_pose_topic: "/gps_pose"      # gps_node
    deadman_topic: "/deadman/alive"  # deadman_node

    # Camera
    camera_image_topic: "/zed/left_camera/image_raw"  # webcam_publisher
    camera_info_topic: "/my/camera_info"              # webcam_publisher
    camera_extrinsics_topic: "/my/camera_extrinsics"  # webcam_publisher

    # Teleop
    joy_topic: "/vehicle_internal/joystick/raw"                    # joy_node -> joystick_reader
    joystick_movement_topic: "/vehicle_internal/joystick/commands" # joystick_reader -> uart_writer

    # Autonomy
    mpc_movement_topic: "/mpc"  # MPC_Node (autonomous-systems-core) -> uart_writer

    # Shared files and devices
    camera_device_path: "/dev/v4l/by-id/usb-Elgato_Elgato_Facecam_MK.2_A6HTB52822IIIY-video-index0"

    gps_device_path: "/dev/ttyUSB1"
    camera_intrinsics_path: "calibration/camera_intrinsics.json"  # calibrate_intrinsics -> webcam_publisher, calibrate_extrinsics
    camera_extrinsics_path: "calibration/camera_extrinsics.json"  # calibrate_extrinsics -> webcam_publisher
    magnetometer_coefficients_path: "calibration/magnetometer_coefficients.json"  # calibrate_magnetometer -> mag_node

# Sensor nodes parameters
webcam_publisher:
  ros__parameters:
    publish_rate: 30.0
    frame_width: 1280
    frame_height: 720
    camera_fps: 30.0
    pixel_format: "MJPG"
    # Exposure values are in V4L2 units of 100 us (e.g. 3 = 0.3 ms).
    configure_exposure: true
    exposure_absolute: 3      # fixed value, or starting point of the auto-tune search
    exposure_auto: 1          # 1 = manual exposure mode (UVC menu value)
    exposure_fail_fast: false # true: fail configure if exposure controls cannot be written
    # Auto-tune runs during the lifecycle configure step, before any frame is published.
    auto_tune_exposure: true
    exposure_target_brightness: 110.0    # mean gray level, 0-255
    exposure_brightness_tolerance: 15.0
    exposure_min: 1
    exposure_max: 0                      # 0 = one frame period (10000 / camera_fps); lower it to reduce motion blur
    exposure_max_iterations: 10
    exposure_settle_frames: 8            # frames dropped after each exposure change
    exposure_metering_top_fraction: 0.0  # ignore this top fraction of the image (e.g. sky) when metering
    # Calibration topics; a missing calibration file only disables its topic.
    publish_intrinsics: true  # CameraInfo with each frame, same stamp as the image
    publish_extrinsics: true

joy_node:
  ros__parameters:
    device_id: 0              # corresponds to /dev/input/js0
    deadzone: 0.05
    autorepeat_rate: 20.0

deadman_node:
  ros__parameters:
    alive_timeout: 0.5 # seconds without an ALIVE line before disarming

mag_node:
  ros__parameters:
    apply_mag_calib: true

gps_node:
  ros__parameters:
    use_first_fix_as_origin: false
    origin_latitude: 38.7366804
    origin_longitude: -9.300988216666667
    origin_altitude: 0.0
    synthetic_mode: false

# Overrides bluespace_ai_xsens_mti_driver/param/xsens_mti_node.yaml (loaded first by sensors_launch.xml)
xsens_mti_node:
  ros__parameters:
    scan_for_devices: false  # driver default true ignores port and baudrate
    port: "/dev/ttyUSB0"
    baudrate: 115200
    frame_id: "imu_link"
    # world -> imu_link would conflict with the static base_link -> imu_link of the fusion launch
    pub_transform: false
    # Only the combined IMU message (-> /imu_data) and the magnetometer (-> /mag_data) are consumed.
    pub_imu: true
    pub_mag: true  # normalized field vector (unitless), not tesla like mag_node
    pub_quaternion: false
    pub_acceleration: false
    pub_angular_velocity: false
    pub_dq: false
    pub_dv: false
    pub_sampletime: false
    pub_temperature: false
    pub_pressure: false
    pub_gnss: false
    pub_twist: false
    pub_free_acceleration: false
    pub_positionLLA: false
    pub_velocity: false
    # 1-sigma noise; the driver ships zeros, which tells robot_localization the sensor is perfect.
    orientation_stddev: [0.01, 0.01, 0.02]
    angular_velocity_stddev: [0.005, 0.005, 0.01]
    linear_acceleration_stddev: [0.05, 0.05, 0.05]

# Utility nodes parameters
uart_reader:
  ros__parameters:
    serial_port: "/dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_54:32:04:86:E7:30-if00" # CANToPC (sensor UART read)


uart_writer:
  ros__parameters:
    serial_port: "/dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_80:F1:B2:65:8F:A0-if00" # PCToCAN (command UART write)
    mpc_max_rpm: 338            # MPC RPM mapped to full joystick throttle (R2: 50); 338 is about 1 m/s
    mpc_timeout: 0.5            # seconds without /mpc before idle joystick commands are written again
    joystick_override_hold: 1.0 # seconds the joystick keeps control after its last input
